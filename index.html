<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>KEEPER10</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <section id="home" class="screen active">
      <header class="hero">
        <div class="brand">KEEPER<span>10</span></div>
        <p>Die ersten 6 Übungen. Direkt auf dem iPhone nutzbar.</p>
      </header>

      <section class="intro card">
        <h1>Torhütertraining für sofort</h1>
        <p>Erst anschauen, dann trainieren. Ohne Material oder nur mit einem Tennisball.</p>
      </section>

      <section class="group">
        <div class="group-head">
          <h2>Nur ich</h2>
          <span class="tag">ohne Material</span>
        </div>
        <div class="card-list">
          <button class="exercise-card" data-id="bereit">
            <img src="bereit.png" alt="Bereit" loading="lazy">
            <div class="text"><h3>1 · Bereit!</h3><p>Auf Signal sofort in die Grundstellung gehen.</p></div>
          </button>
          <button class="exercise-card" data-id="schritte-und-stopp">
            <img src="schritte-und-stopp.png" alt="Schritte und Stopp" loading="lazy">
            <div class="text"><h3>2 · Schritte &amp; Stopp</h3><p>Kleine Schritte. Stoppen. Bereit sein.</p></div>
          </button>
          <button class="exercise-card" data-id="spring-land-bereit">
            <img src="spring-land-bereit.png" alt="Spring Land Bereit" loading="lazy">
            <div class="text"><h3>3 · Spring · Land · Bereit</h3><p>Spring kurz. Lande weich. Sei sofort wieder bereit.</p></div>
          </button>
        </div>
      </section>

      <section class="group">
        <div class="group-head">
          <h2>Tennisball</h2>
          <span class="tag">nur ich + 1 Tennisball</span>
        </div>
        <div class="card-list">
          <button class="exercise-card" data-id="fallen-und-fangen">
            <img src="fallen-und-fangen.png" alt="Fallen und Fangen" loading="lazy">
            <div class="text"><h3>1 · Fallen &amp; Fangen</h3><p>Ball fallen lassen und nach dem ersten Aufprall sichern.</p></div>
          </button>
          <button class="exercise-card" data-id="hoch-und-hin">
            <img src="hoch-und-hin.png" alt="Hoch und Hin" loading="lazy">
            <div class="text"><h3>2 · Hoch &amp; Hin</h3><p>Ball leicht seitlich hochwerfen und schnell darunter gehen.</p></div>
          </button>
          <button class="exercise-card" data-id="schraeger-absprung">
            <img src="schraeger-absprung.png" alt="Schräger Absprung" loading="lazy">
            <div class="text"><h3>3 · Schräger Absprung</h3><p>Ball schräg aufwerfen und auf den Absprung reagieren.</p></div>
          </button>
        </div>
      </section>
    </section>

    <section id="detail" class="screen">
      <button id="backBtn" class="back">← Zurück</button>
      <article class="detail-card">
        <div class="detail-top">
          <span id="detailCategory" class="tag"></span>
          <h2 id="detailTitle"></h2>
          <p id="detailDesc"></p>
          <div class="chips">
            <span id="chip1" class="chip"></span>
            <span id="chip2" class="chip"></span>
            <span id="chip3" class="chip"></span>
          </div>
        </div>
        <img id="detailImage" class="detail-image" src="" alt="">
        <div class="columns">
          <div class="box">
            <h3>So geht’s</h3>
            <ol id="detailSteps"></ol>
          </div>
          <div class="box">
            <h3>Achte darauf</h3>
            <ul id="detailFocus"></ul>
          </div>
        </div>
      </article>
      <div class="sticky-bar">
        <button id="openTimer" class="cta">Timer starten</button>
      </div>
    </section>

    <section id="timer" class="screen">
      <button id="timerBack" class="back">← Zurück</button>
      <article class="timer-card card">
        <p id="timerKicker" class="timer-kicker"></p>
        <div id="timerTime" class="timer-time">00:30</div>
        <p id="timerInfo" class="timer-info"></p>
        <div class="timer-buttons">
          <button id="playPause" class="cta">Start</button>
          <button id="reset" class="ghost">Neu</button>
        </div>
      </article>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
